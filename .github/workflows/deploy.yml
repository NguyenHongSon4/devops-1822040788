
name: Website CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html || {
            echo "ERROR: Missing index.html"
            exit 1
          }

          test -f style.css || {
            echo "ERROR: Missing style.css"
            exit 1
          }

          test -f script.js || {
            echo "ERROR: Missing script.js"
            exit 1
          }

          echo "PASS: All 3 required files exist"

      - name: Check HTML title
        run: |
          if grep -Eiq '<title[^>]*>.*</title>' index.html; then
            echo "PASS: HTML title exists"
          else
            echo "ERROR: index.html is missing a title tag"
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
